name: Lint, Build Docs, and Publish Chart

on:
  push:
    branches:
      - main

jobs:
  lint-test:
    runs-on: ubuntu-latest
    name: Lint ${{ matrix.chart }}
    strategy:
      matrix:
        chart:
          - tigerbeetle
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Add Helm repos
        run: |
          helm repo add bjw-s https://bjw-s-labs.github.io/helm-charts
          helm repo update

      - name: Run chart-testing (lint)
        working-directory: charts/${{ matrix.chart }}
        run: |
          helm dependency update
          helm lint .

      - name: Run chart-testing (template)
        working-directory: charts/${{ matrix.chart }}
        run: helm template .


  build-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install MkDocs and dependencies
        run: |
          pip install mkdocs-material mkdocs-git-revision-date-localized-plugin mkdocs-minify-plugin pymdown-extensions --force

      - name: Build MkDocs site
        run: mkdocs build --clean

  publish-chart:
    needs:
      - lint-test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Add Helm repos
        run: |
          helm repo add bjw-s https://bjw-s-labs.github.io/helm-charts
          helm repo update

      - name: Update chart dependencies
        working-directory: charts/tigerbeetle
        run: helm dependency update

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Package chart
        working-directory: charts/tigerbeetle
        run: helm package .

      - name: Push chart to GHCR (OCI)
        working-directory: charts/tigerbeetle
        run: helm push tigerbeetle-*.tgz oci://ghcr.io/adorsys-gis/charts
